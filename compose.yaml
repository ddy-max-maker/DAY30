services:

  # ============ 入口：反向代理 ============
  # 浏览器 → localhost:8080 → nginx → backend:8000
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-compose

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      # 通过反代访问 /health：同时验证 nginx 自身和 backend 链路
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============ 应用 ============
  backend:
    build: .
    container_name: backend-compose

    ports:
      - "8001:8000"

    env_file:
      - .env

    # 服务名寻址：容器内一律走 Compose 网络，
    # 不出现 127.0.0.1 / 宿主机映射端口
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      TZ: Asia/Shanghai

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    healthcheck:
      # slim 镜像没有 curl，用 python 标准库探测 /health
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ============ 中间件 ============
  redis:
    image: redis:7
    container_name: redis-compose

    ports:
      - "6382:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  mysql:
    image: mysql:8.0
    container_name: mysql-compose

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-compose

    ports:
      - "5672:5672"     # AMQP：FastAPI 连 rabbitmq:5672（容器内）
      - "15672:15672"   # 管理界面：浏览器开 localhost:15672

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


volumes:
  redis-data:
  mysql-data:
  rabbitmq-data:
